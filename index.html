<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AbiLearn — A Grand Opening Tribute</title>
<meta name="description" content="A ceremonial Teacher's Day grand opening of AbiLearn, dedicated to Abi Mam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600;1,900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* ============ Design tokens ============ */
  :root{
    --deep-red: #3a0402;
    --crimson: #6e0d0d;
    --crimson-mid: #8a1414;
    --crimson-light: #a51a1a;
    --gold: #d4af37;
    --gold-light: #f3d576;
    --gold-bright: #ffedb0;
    --cream: #fff7e8;
    --ink: #2a0505;
    --ease-ceremony: cubic-bezier(.65,0,.35,1);
    --cut-ease: cubic-bezier(.55,.05,.4,1);

    /* Page-two "tribute plaque" theme — deliberately distinct from the red ceremony */
    --plaque-bg-1: #fffaf0;
    --plaque-bg-2: #f6e9c8;
    --plaque-bg-3: #efdcae;
    --burgundy: #7a1428;
    --burgundy-deep: #4a0d18;
    --gold2: #b8862a;
    --gold2-bright: #f0d78c;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    background:var(--cream);
    color:var(--ink);
  }
  html.ceremony-lock, html.ceremony-lock body{
    overflow:hidden;
    height:100%;
  }
  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ============================================================
     PAGE TWO — the AbiLearn tribute plaque, revealed after the cut
     ============================================================ */
  #site{
    position:relative;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:clamp(.5rem,2vh,1.4rem) clamp(.75rem,3vw,1.5rem);
    overflow:hidden;
    background:
      radial-gradient(ellipse 70% 55% at 50% 8%, #ffffff 0%, var(--plaque-bg-1) 45%, var(--plaque-bg-2) 78%, var(--plaque-bg-3) 100%);
  }
  #site::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    opacity:.5;
    background-image:
      repeating-linear-gradient(115deg, rgba(184,134,42,.05) 0 2px, transparent 2px 42px),
      repeating-linear-gradient(25deg, rgba(122,20,40,.035) 0 2px, transparent 2px 46px);
  }
  #site-sparkles{
    position:absolute; inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .site-ember{
    position:absolute;
    bottom:-4%;
    border-radius:50%;
    background:radial-gradient(circle, var(--gold2-bright), var(--gold2) 70%, transparent 100%);
    opacity:0;
    animation-name:emberRise;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
  }
  @keyframes emberRise{
    0%{ opacity:0; transform:translateY(0) scale(.6); }
    12%{ opacity:.85; }
    100%{ opacity:0; transform:translateY(-92vh) scale(1.1); }
  }

  .tribute-card{
    position:relative;
    z-index:2;
    max-width:44em;
    max-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:clamp(1rem,3.2vh,2.2rem) clamp(1.1rem,5vw,3.2rem);
    border:1.5px solid rgba(184,134,42,.55);
    border-radius:22px;
    background:rgba(255,253,246,.5);
    backdrop-filter:blur(2px);
    box-shadow:
      0 30px 70px -30px rgba(74,13,24,.35),
      inset 0 0 0 7px rgba(255,255,255,.45),
      inset 0 0 0 8px rgba(184,134,42,.18);
  }

  /* On phones, the plaque becomes a proper full-bleed rectangle that
     fits the screen edge to edge, instead of a small card floating
     in a sea of background. */
  @media (max-width:640px){
    #site{ padding:12px; }
    .tribute-card{
      width:100%;
      height:100%;
      max-width:100%;
      justify-content:space-evenly;
      border-radius:16px;
    }
  }
  .plaque-corner{
    position:absolute;
    width:30px; height:30px;
    border:2px solid var(--gold2);
    opacity:.85;
  }
  .plaque-corner.tl{ top:-1px; left:-1px; border-right:none; border-bottom:none; border-radius:10px 0 0 0; }
  .plaque-corner.tr{ top:-1px; right:-1px; border-left:none; border-bottom:none; border-radius:0 10px 0 0; }
  .plaque-corner.bl{ bottom:-1px; left:-1px; border-right:none; border-top:none; border-radius:0 0 0 10px; }
  .plaque-corner.br{ bottom:-1px; right:-1px; border-left:none; border-top:none; border-radius:0 0 10px 0; }

  .site-mark{
    font-family:'Playfair Display', serif;
    font-weight:700;
    letter-spacing:.22em;
    font-size:clamp(.9rem,3vmin,1.25rem);
    text-transform:uppercase;
    color:var(--gold2);
    margin:0 0 .35em;
  }
  .site-mark b{ color:var(--burgundy); font-weight:900; letter-spacing:.22em; }

  .flourish{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.7em;
    margin:0 0 clamp(.6em,2vh,1.1em);
    color:var(--gold2);
  }
  .flourish::before, .flourish::after{
    content:"";
    height:1px; width:clamp(24px,6vw,60px);
    background:linear-gradient(90deg, transparent, var(--gold2), transparent);
  }
  .flourish span{ font-size:1.3rem; }

  .tribute-line1{
    font-size:clamp(1.55rem,6.4vmin,2.55rem);
    font-style:italic;
    font-weight:700;
    line-height:1.32;
    color:var(--burgundy-deep);
    margin:0 0 clamp(.4em,1.6vh,.7em);
  }
  .tribute-line2{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:clamp(2.5rem,10vmin,5rem);
    line-height:1.02;
    color:var(--burgundy);
    text-shadow:0 2px 0 rgba(255,255,255,.5);
    margin:0 0 clamp(.15em,.8vh,.3em);
  }
  .tribute-line3{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-style:italic;
    font-size:clamp(2rem,8.8vmin,4.3rem);
    margin:0 0 clamp(.4em,1.6vh,.8em);
    background:linear-gradient(100deg, #6b4a10 15%, #b3860f 40%, #d9a91f 50%, #b3860f 60%, #6b4a10 85%);
    background-size:250% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shimmerText 5s ease-in-out infinite;
  }
  @keyframes shimmerText{
    0%{ background-position:220% 0; }
    100%{ background-position:-40% 0; }
  }

  .site-signature{
    font-size:clamp(1.05rem,3.4vmin,1.4rem);
    font-style:italic;
    color:var(--burgundy-deep);
    opacity:.8;
    margin:0 0 clamp(.6em,2vh,1.2em);
  }

  #site .site-cta{
    display:inline-block;
    padding:clamp(.55em,1.6vh,.85em) clamp(1.5em,4vw,2.6em);
    border-radius:999px;
    background:linear-gradient(135deg,var(--burgundy),var(--burgundy-deep));
    color:var(--gold2-bright);
    text-decoration:none;
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:clamp(1.05rem,3.4vmin,1.4rem);
    letter-spacing:.05em;
    box-shadow:0 14px 34px -10px rgba(74,13,24,.6);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  #site .site-cta:hover, #site .site-cta:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 18px 38px -10px rgba(74,13,24,.7);
  }

  /* Entrance choreography — only plays once the ceremony reveals this page */
  .site-mark, .flourish, .tribute-line1, .tribute-line2, .tribute-line3,
  .site-signature, #site .site-cta{
    opacity:0;
    transform:translateY(16px);
  }
  #site.revealed .site-mark{ animation:siteFadeUp .8s var(--ease-ceremony) forwards .05s; }
  #site.revealed .flourish{ animation:siteFadeUp .8s var(--ease-ceremony) forwards .18s; }
  #site.revealed .tribute-line1{ animation:siteFadeUp .8s var(--ease-ceremony) forwards .32s; }
  #site.revealed .tribute-line2{ animation:siteFadeUp .8s var(--ease-ceremony) forwards .5s; }
  #site.revealed .tribute-line3{ animation:siteFadeUp .8s var(--ease-ceremony) forwards .68s; }
  #site.revealed .site-signature{ animation:siteFadeUp .8s var(--ease-ceremony) forwards .82s; }
  #site.revealed #site .site-cta,
  #site.revealed .site-cta{ animation:siteFadeUp .8s var(--ease-ceremony) forwards .96s; }
  @keyframes siteFadeUp{ to{ opacity:1; transform:translateY(0); } }

  @media (prefers-reduced-motion: reduce){
    .site-mark, .flourish, .tribute-line1, .tribute-line2, .tribute-line3,
    .site-signature, #site .site-cta{ animation-duration:.01ms !important; }
    .tribute-line3{ animation:none !important; background-position:0 0; }
  }

  /* ============================================================
     PAGE ONE — the grand opening ceremony (intentionally wordless)
     ============================================================ */
  #ceremony{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:9999;
    overflow:hidden;
    background:var(--deep-red);
    touch-action:none;
  }
  #ceremony[hidden]{ display:none; }

  .curtain{
    position:absolute;
    top:0;
    bottom:0;
    width:50%;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(0,0,0,.16) 0px,
        rgba(0,0,0,.16) 6px,
        rgba(255,255,255,.045) 6px,
        rgba(255,255,255,.045) 13px,
        transparent 13px,
        transparent 34px
      ),
      radial-gradient(ellipse at top, var(--crimson-light) 0%, var(--crimson) 45%, var(--deep-red) 100%);
    transition:transform 1.65s var(--ease-ceremony);
    box-shadow: inset 0 0 140px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.4);
  }
  .curtain::before{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:120px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.5), transparent 70%);
  }
  .curtain-left{ left:0; transform:translateX(0); border-right:3px solid var(--gold); }
  .curtain-right{ right:0; transform:translateX(0); border-left:3px solid var(--gold); }
  .curtain-left::before{ right:-40px; }
  .curtain-right::before{ left:-40px; }

  #ceremony.opening .curtain-left{ transform:translateX(-102%); }
  #ceremony.opening .curtain-right{ transform:translateX(102%); }

  .spotlight-sweep{
    position:absolute;
    left:50%; top:50%;
    width:900px; height:900px;
    margin:-450px 0 0 -450px;
    background:conic-gradient(from 0deg, rgba(255,230,170,.09), transparent 25%, transparent 75%, rgba(255,230,170,.09));
    animation:sweepRotate 26s linear infinite;
    z-index:1;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  @keyframes sweepRotate{ to{ transform:rotate(360deg); } }

  #ceremony-sparkles{
    position:absolute; inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
  }
  .sparkle{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, #fff6da, var(--gold) 65%, transparent 100%);
    opacity:0;
    animation-name:sparkleDrift;
    animation-timing-function:ease-in-out;
    animation-fill-mode:forwards;
  }
  @keyframes sparkleDrift{
    0%{ opacity:0; transform:translateY(0) scale(.5); }
    50%{ opacity:.8; }
    100%{ opacity:0; transform:translateY(-60px) scale(1); }
  }

  .ceremony-vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 50% 40%, rgba(255,230,170,.14), transparent 60%),
      radial-gradient(ellipse 120% 90% at 50% 50%, transparent 50%, rgba(0,0,0,.45) 100%);
    z-index:2;
  }

  .ceremony-content{
    position:relative;
    z-index:3;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 6vw;
    transition:opacity .6s ease, transform .6s ease;
  }
  #ceremony.opening .ceremony-content{
    opacity:0;
    transform:scale(1.04);
    pointer-events:none;
  }

  .loading-ring{
    width:46px; height:46px;
    border-radius:50%;
    border:3px solid rgba(212,175,55,.25);
    border-top-color:var(--gold);
    animation:spin 1s linear infinite;
    transition:opacity .4s ease;
  }
  .loading-ring[hidden]{ display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .ceremony-stage{
    display:flex;
    align-items:center;
    justify-content:center;
    animation:stageFadeIn .8s var(--ease-ceremony) forwards;
    opacity:0;
  }
  .ceremony-stage[hidden]{ display:none; }
  @keyframes stageFadeIn{ to{ opacity:1; } }

  .ribbon-rig{
    width:min(560px,90vw);
    height:auto;
    filter:drop-shadow(0 14px 26px rgba(0,0,0,.5));
    overflow:visible;
  }

  /* The scissors: a standalone element free to roam the ENTIRE ceremony
     screen (not just the area near the ribbon). transform-origin sits
     exactly on the pivot so rotating in flight never shifts its
     effective position — that keeps the swoop-to-cut math exact. */
  .floating-scissors{
    position:fixed;
    left:0;
    top:0;
    width:96px;
    height:138px;
    padding:0;
    margin:0;
    background:none;
    border:none;
    outline:none;
    cursor:pointer;
    z-index:6;
    transform-origin:48px 96px;
    -webkit-tap-highlight-color:transparent;
    filter:drop-shadow(0 12px 20px rgba(0,0,0,.55));
    opacity:0;
    transition:transform .95s var(--cut-ease), opacity .5s ease;
  }
  .floating-scissors.visible{ opacity:1; }
  .floating-scissors:focus-visible{
    outline:2.5px solid var(--gold-bright);
    outline-offset:6px;
    border-radius:16px;
  }
  .floating-scissors svg{ width:100%; height:100%; display:block; overflow:visible; }

  .glow-pulse{
    animation:pulseGlow 2.4s ease-in-out infinite;
    transform-origin:230px 62px;
  }
  @keyframes pulseGlow{
    0%,100%{ opacity:.3; transform:scale(1); }
    50%{ opacity:.7; transform:scale(1.2); }
  }

  .contact-shadow{
    opacity:.12;
    transform:scale(.5);
    transform-origin:230px 74px;
    transition:opacity .9s var(--cut-ease), transform .9s var(--cut-ease);
  }
  .contact-shadow.active{ opacity:.55; transform:scale(1.1); }

  .ribbon-left, .ribbon-right, .ribbon-knot, .ribbon-hl-left, .ribbon-hl-right{
    transition:transform .6s ease, opacity .5s ease .08s;
  }
  .ribbon-left, .ribbon-hl-left{ transform-origin:226px 60px; }
  .ribbon-right, .ribbon-hl-right{ transform-origin:234px 60px; }
  .ribbon-knot{ transform-origin:230px 62px; }
  #ceremony.cutting .ribbon-left, #ceremony.cutting .ribbon-hl-left{ transform:translate(-34px,32px) rotate(-18deg); opacity:0; }
  #ceremony.cutting .ribbon-right, #ceremony.cutting .ribbon-hl-right{ transform:translate(34px,32px) rotate(18deg); opacity:0; }
  #ceremony.cutting .ribbon-knot{ transform:scale(.3); opacity:0; }

  .flourish-swirl{
    opacity:.55;
    transition:opacity .5s ease;
  }
  #ceremony.cutting .flourish-swirl{ opacity:0; }

  /* Blades snap shut the instant the scissors arrive at the ribbon —
     triggered purely by toggling .active on the floating-scissors button. */
  .blade{
    transform-origin:0 0;
    transition:transform .4s var(--cut-ease);
  }
  .blade-left{ transform:rotate(-20deg); }
  .blade-right{ transform:rotate(20deg); }
  .floating-scissors.active .blade-left{ transform:rotate(-3deg); }
  .floating-scissors.active .blade-right{ transform:rotate(3deg); }

  #confetti-container{
    position:absolute;
    inset:0;
    z-index:5;
    pointer-events:none;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:-5%;
    border-radius:2px;
    opacity:0;
    animation-name:confettiFall;
    animation-timing-function:ease-in;
    animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    0%{ opacity:0; transform:translateY(0) rotate(0deg); }
    8%{ opacity:1; }
    100%{ opacity:0; transform:translateY(105vh) rotate(600deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .curtain, .ceremony-content, .ribbon-left, .ribbon-right, .ribbon-knot,
    .ribbon-hl-left, .ribbon-hl-right, .floating-scissors, .blade, .ceremony-stage,
    .spotlight-sweep, .contact-shadow{
      transition-duration:.01ms !important;
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
    }
  }
</style>
</head>
<body>

  <!-- ============ PAGE TWO: the AbiLearn tribute, revealed once the ribbon is cut ============ -->
  <main id="site" aria-hidden="true">
    <div id="site-sparkles" aria-hidden="true"></div>
    <div class="tribute-card">
      <span class="plaque-corner tl" aria-hidden="true"></span>
      <span class="plaque-corner tr" aria-hidden="true"></span>
      <span class="plaque-corner bl" aria-hidden="true"></span>
      <span class="plaque-corner br" aria-hidden="true"></span>

      <p class="site-mark">Abi<b>Learn</b></p>
      <div class="flourish" aria-hidden="true"><span>❈</span></div>

      <p class="tribute-line1">It is my greatest tribute to you mam in my last year of school.</p>
      <p class="tribute-line2">Happy Teacher's Day Mam</p>
      <p class="tribute-line3">Abi Mam Forever <span class="heart">❤️</span></p>
      <p class="site-signature">— with endless gratitude, Priyadharshan S</p>

      <a class="site-cta" id="siteEnterLink" href="https://www.abilearn.co.in" rel="noopener">Enter AbiLearn →</a>
    </div>
  </main>

  <!-- ============ PAGE ONE: grand opening ceremony (intentionally wordless) ============ -->
  <div id="ceremony" role="dialog" aria-modal="true" aria-label="AbiLearn Teacher's Day grand opening ceremony">
    <div class="curtain curtain-left" aria-hidden="true"></div>
    <div class="curtain curtain-right" aria-hidden="true"></div>
    <div class="spotlight-sweep" aria-hidden="true"></div>
    <div class="ceremony-vignette" aria-hidden="true"></div>
    <div id="ceremony-sparkles" aria-hidden="true"></div>

    <div class="ceremony-content">
      <div class="loading-ring" id="loadingRing" role="status" aria-label="Preparing the ceremony"></div>

      <div class="ceremony-stage" id="ceremonyStage" hidden>
          <svg class="ribbon-rig" viewBox="0 0 460 210" preserveAspectRatio="xMidYMid meet" focusable="false" aria-hidden="true">
            <defs>
              <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffedb0"/>
                <stop offset="45%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#8a651c"/>
              </linearGradient>
              <radialGradient id="knotGrad" cx="35%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#fff6da"/>
                <stop offset="60%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#7a5a17"/>
              </radialGradient>
              <linearGradient id="bladeGrad" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#8f98a3"/>
                <stop offset="55%" stop-color="#d8dee5"/>
                <stop offset="100%" stop-color="#f6f8fa"/>
              </linearGradient>
              <radialGradient id="pivotGrad" cx="35%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#fff6da"/>
                <stop offset="100%" stop-color="#b6862a"/>
              </radialGradient>
              <linearGradient id="handleGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffedb0"/>
                <stop offset="100%" stop-color="#b6862a"/>
              </linearGradient>
              <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffedb0" stop-opacity=".9"/>
                <stop offset="100%" stop-color="#ffedb0" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- soft shadow the ribbon casts on the curtain behind it -->
            <path d="M40,80 Q230,98 420,80" stroke="rgba(0,0,0,.35)" stroke-width="10"
                  fill="none" stroke-linecap="round" opacity=".35" style="filter:blur(5px)"/>

            <!-- ceremonial ribbon, gently sagging like a real strung ribbon -->
            <path class="ribbon-left" d="M0,50 C110,18 168,18 226,50 L226,74 C168,42 110,42 0,74 Z" fill="url(#ribbonGrad)"/>
            <path class="ribbon-right" d="M460,50 C350,18 292,18 234,50 L234,74 C292,42 350,42 460,74 Z" fill="url(#ribbonGrad)"/>
            <path class="ribbon-hl-left" d="M8,54 C112,26 168,26 222,54" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linecap="round"/>
            <path class="ribbon-hl-right" d="M452,54 C348,26 292,26 238,54" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linecap="round"/>
            <circle class="ribbon-knot" cx="230" cy="62" r="17" fill="url(#knotGrad)" stroke="#7a5a17" stroke-width="1"/>

            <!-- delicate hand-drawn flourishes flanking the knot, for a bespoke ceremonial feel -->
            <path class="flourish-swirl" d="M188,62 C170,50 170,74 155,66" fill="none" stroke="#f3d576" stroke-width="1.6" stroke-linecap="round"/>
            <path class="flourish-swirl" d="M272,62 C290,50 290,74 305,66" fill="none" stroke="#f3d576" stroke-width="1.6" stroke-linecap="round"/>

            <!-- affordance glow + the shadow the scissors cast as they approach the ribbon -->
            <circle class="glow-pulse" cx="230" cy="62" r="46" fill="url(#glowGrad)"/>
            <ellipse class="contact-shadow" id="contactShadow" cx="230" cy="76" rx="26" ry="7" fill="#1a0402" opacity=".12"/>
          </svg>
      </div>
    </div>

    <!-- Real ceremonial scissors, fully under the visitor's control: they
         follow the mouse/finger anywhere on screen. Click/tap to make them
         swoop the rest of the way to the ribbon and cut. -->
    <button type="button" class="floating-scissors" id="openBtn"
            aria-label="Move to position the scissors, then click or press Enter to cut the ribbon and open AbiLearn">
      <svg viewBox="0 0 96 138" focusable="false">
        <defs>
          <linearGradient id="bladeGrad2" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#8f98a3"/>
            <stop offset="55%" stop-color="#d8dee5"/>
            <stop offset="100%" stop-color="#f6f8fa"/>
          </linearGradient>
          <radialGradient id="pivotGrad2" cx="35%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#fff6da"/>
            <stop offset="100%" stop-color="#b6862a"/>
          </radialGradient>
          <linearGradient id="handleGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffedb0"/>
            <stop offset="100%" stop-color="#b6862a"/>
          </linearGradient>
        </defs>
        <g transform="translate(48,96)">
          <path class="handle" fill="url(#handleGrad2)" fill-rule="evenodd"
                d="M -32,10 a20,26 0 1,0 40,0 a20,26 0 1,0 -40,0 M -24,10 a12,16 0 1,0 24,0 a12,16 0 1,0 -24,0"/>
          <path class="handle" fill="url(#handleGrad2)" fill-rule="evenodd"
                d="M 12,10 a20,26 0 1,0 40,0 a20,26 0 1,0 -40,0 M 20,10 a12,16 0 1,0 24,0 a12,16 0 1,0 -24,0"/>
          <g class="blade blade-left">
            <path fill="url(#bladeGrad2)" stroke="#6b7480" stroke-width=".6"
                  d="M0,0 L-9,-6 C-13,-26 -10,-54 -3,-76 L3,-76 C7,-52 8,-26 6,-6 Z"/>
            <path d="M0,-6 L-1.5,-64" stroke="rgba(255,255,255,.6)" stroke-width="1" stroke-linecap="round"/>
          </g>
          <g class="blade blade-right">
            <path fill="url(#bladeGrad2)" stroke="#6b7480" stroke-width=".6"
                  d="M0,0 L-6,-6 C-8,-26 -7,-52 -3,-76 L3,-76 C9,-54 12,-26 9,-6 Z"/>
            <path d="M0,-6 L1.5,-64" stroke="rgba(255,255,255,.6)" stroke-width="1" stroke-linecap="round"/>
          </g>
          <circle class="pivot" cx="0" cy="0" r="6.5" fill="url(#pivotGrad2)" stroke="#7a5a17" stroke-width="1"/>
        </g>
      </svg>
    </button>

    <div id="confetti-container" aria-hidden="true"></div>
  </div>

  <p class="visually-hidden" id="ceremonyAnnouncer" role="status" aria-live="polite"></p>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Where "Enter AbiLearn" takes visitors. Change this to redirect
  // elsewhere — the link on the tribute page always points here.
  // ---------------------------------------------------------------------
  const ABILEARN_URL = "https://www.abilearn.co.in";

  const htmlEl = document.documentElement;
  const ceremony = document.getElementById('ceremony');
  const loadingRing = document.getElementById('loadingRing');
  const ceremonyStage = document.getElementById('ceremonyStage');
  const openBtn = document.getElementById('openBtn');
  const ribbonRig = document.querySelector('.ribbon-rig');
  const contactShadow = document.getElementById('contactShadow');
  const announcer = document.getElementById('ceremonyAnnouncer');
  const confettiContainer = document.getElementById('confetti-container');
  const ceremonySparkles = document.getElementById('ceremony-sparkles');
  const site = document.getElementById('site');
  const siteEnterLink = document.getElementById('siteEnterLink');
  const siteSparkles = document.getElementById('site-sparkles');

  // Pivot offset within the scissors' own SVG (must match its viewBox/markup).
  const PIVOT_X = 48, PIVOT_Y = 96;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (siteEnterLink) siteEnterLink.href = ABILEARN_URL;

  htmlEl.classList.add('ceremony-lock');

  let opened = false;
  let sparkleTimer = null;
  let emberTimer = null;

  // ---- Ambient golden sparkles drifting across the ceremony (idle atmosphere) ----
  function spawnSparkle() {
    const s = document.createElement('span');
    s.className = 'sparkle';
    const size = 3 + Math.random() * 5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (5 + Math.random() * 90) + 'vw';
    s.style.top = (10 + Math.random() * 75) + 'vh';
    s.style.animationDuration = (2.4 + Math.random() * 2.2) + 's';
    ceremonySparkles.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
  if (!reduceMotion) {
    sparkleTimer = window.setInterval(spawnSparkle, 380);
  }

  // Reads an element's current on-screen transform (translate + rotation),
  // however far a transition has carried it — used both to freeze the
  // scissors mid-flight and to know exactly where their pivot sits now.
  function readCurrentTransform(el) {
    const cssTransform = getComputedStyle(el).transform;
    if (!cssTransform || cssTransform === 'none') return { x: 0, y: 0, deg: 0 };
    const m = new DOMMatrixReadOnly(cssTransform);
    const deg = Math.atan2(m.b, m.a) * (180 / Math.PI);
    return { x: m.e, y: m.f, deg };
  }

  // The ribbon's actual on-screen cut point, however the SVG is currently
  // scaled by the viewport — computed live so the swoop always lands exactly.
  function getRibbonContactPoint() {
    const r = ribbonRig.getBoundingClientRect();
    return { x: r.left + r.width * (230 / 460), y: r.top + r.height * (62 / 210) };
  }

  function setScissorsPivot(px, py, deg, durationMs) {
    openBtn.style.transitionDuration = durationMs + 'ms';
    openBtn.style.transform = `translate(${px - PIVOT_X}px, ${py - PIVOT_Y}px) rotate(${deg}deg)`;
  }

  // ---- The scissors are fully user-controlled: they follow the pointer/
  // finger directly (a short transition just smooths out jitter) rather
  // than moving on their own. ----
  const FOLLOW_MS = 90;

  function handlePointerMove(e) {
    if (opened || ceremonyStage.hidden) return;
    setScissorsPivot(e.clientX, e.clientY, 0, FOLLOW_MS);
  }

  // ---- Intentional "loading" beat before the ribbon & scissors appear ----
  window.setTimeout(() => {
    loadingRing.hidden = true;
    ceremonyStage.hidden = false;

    // Start the scissors right above the ribbon (no jump); from here on
    // they only go where the user's mouse/finger takes them.
    requestAnimationFrame(() => {
      const start = getRibbonContactPoint();
      setScissorsPivot(start.x, start.y, 0, 0);
      void openBtn.offsetWidth;
      openBtn.classList.add('visible');
      openBtn.focus();
      ceremony.addEventListener('pointermove', handlePointerMove);
    });
  }, reduceMotion ? 50 : 1200);

  function launchConfetti() {
    const colors = ['#d4af37', '#f3d576', '#ffedb0', '#ffffff'];
    const count = reduceMotion ? 0 : 90;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      const size = 6 + Math.random() * 8;
      piece.style.width = size + 'px';
      piece.style.height = size * (0.4 + Math.random() * 0.6) + 'px';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      piece.style.animationDelay = (Math.random() * 0.5) + 's';
      confettiContainer.appendChild(piece);
      piece.addEventListener('animationend', () => piece.remove());
    }
  }

  function openCeremony() {
    if (opened || ceremonyStage.hidden) return;
    opened = true;

    ceremony.removeEventListener('pointermove', handlePointerMove);
    openBtn.disabled = true;
    announcer.textContent = 'The scissors are swooping in to cut the ribbon…';

    // Freeze the scissors exactly where the user's pointer left them, then
    // swoop from that real position onto the ribbon's actual on-screen
    // location — accurate no matter how the page is sized.
    const cur = readCurrentTransform(openBtn);
    const currentPivot = { x: cur.x + PIVOT_X, y: cur.y + PIVOT_Y };
    setScissorsPivot(currentPivot.x, currentPivot.y, cur.deg, 0);
    void openBtn.offsetWidth;

    const target = getRibbonContactPoint();
    const swoopDuration = reduceMotion ? 30 : 900;
    setScissorsPivot(target.x, target.y, 0, swoopDuration);

    contactShadow.classList.add('active');
    // Blades snap shut in the final stretch of the flight so the close
    // reads as caused by reaching the ribbon, not a fixed timer.
    window.setTimeout(() => openBtn.classList.add('active'),
      reduceMotion ? 0 : Math.max(0, swoopDuration - 380));

    let cutFired = false;
    const triggerCut = () => {
      if (cutFired) return;
      cutFired = true;
      ceremony.classList.add('cutting');
      announcer.textContent = 'The ribbon is cut — AbiLearn is opening…';

      window.setTimeout(() => {
        ceremony.classList.add('opening');
        launchConfetti();
      }, reduceMotion ? 0 : 480);

      window.setTimeout(finishCeremony, reduceMotion ? 50 : 480 + 1650);
    };

    // The cut fires automatically the instant the scissors reach the ribbon.
    openBtn.addEventListener('transitionend', function handler(e) {
      if (e.propertyName !== 'transform') return;
      openBtn.removeEventListener('transitionend', handler);
      triggerCut();
    });
    window.setTimeout(triggerCut, swoopDuration + (reduceMotion ? 60 : 150));
  }

  // ---- Ambient embers drifting up through the revealed tribute page ----
  function spawnEmber() {
    const e = document.createElement('span');
    e.className = 'site-ember';
    const size = 4 + Math.random() * 6;
    e.style.width = size + 'px';
    e.style.height = size + 'px';
    e.style.left = (4 + Math.random() * 92) + 'vw';
    e.style.animationDuration = (5 + Math.random() * 3) + 's';
    siteSparkles.appendChild(e);
    e.addEventListener('animationend', () => e.remove());
  }

  function finishCeremony() {
    if (sparkleTimer) { window.clearInterval(sparkleTimer); sparkleTimer = null; }

    ceremony.setAttribute('hidden', '');
    ceremony.setAttribute('aria-hidden', 'true');
    htmlEl.classList.remove('ceremony-lock');

    site.removeAttribute('aria-hidden');
    site.classList.add('revealed');
    site.setAttribute('tabindex', '-1');
    site.focus();

    announcer.textContent = "AbiLearn is now open. Happy Teacher's Day, Abi Mam!";

    if (!reduceMotion) {
      emberTimer = window.setInterval(spawnEmber, 550);
    }
  }

  // Clicking/tapping anywhere in the ceremony cuts — the scissors are
  // already wherever the user's pointer put them. (A keyboard "click" on
  // the focused button bubbles here too, so Enter/Space still work.)
  ceremony.addEventListener('click', openCeremony);

  document.addEventListener('keydown', (e) => {
    if (opened) return;
    if (e.key === 'Enter' && !ceremony.hasAttribute('hidden') && document.activeElement !== openBtn) {
      openCeremony();
    }
  });
})();
</script>
</body>
</html>
