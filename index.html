<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AbiLearn — A Grand Opening Tribute</title>
<meta name="description" content="A ceremonial Teacher's Day grand opening of AbiLearn, dedicated to Abi Mam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  /* ============ Design tokens ============ */
  :root{
    --deep-red: #3a0402;
    --crimson: #6e0d0d;
    --crimson-mid: #8a1414;
    --crimson-light: #a51a1a;
    --gold: #d4af37;
    --gold-light: #f3d576;
    --gold-bright: #ffedb0;
    --cream: #fff7e8;
    --ink: #2a0505;
    --ease-ceremony: cubic-bezier(.65,0,.35,1);
    --cut-ease: cubic-bezier(.55,.05,.4,1);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    background:var(--cream);
    color:var(--ink);
  }
  html.ceremony-lock, html.ceremony-lock body{
    overflow:hidden;
    height:100%;
  }
  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ============ Revealed AbiLearn site (underneath the ceremony) ============ */
  #site{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8vh 6vw;
    background:
      radial-gradient(circle at 50% 0%, #fffdf6 0%, var(--cream) 60%),
      var(--cream);
  }
  #site .site-mark{
    position:absolute;
    top:26px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Playfair Display', serif;
    font-weight:700;
    letter-spacing:.06em;
    font-size:.95rem;
    text-transform:uppercase;
    color:var(--crimson);
    opacity:.7;
  }
  #site .site-mark span{ color:var(--gold); }
  .tribute-final{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.9em;
    max-width:38em;
    margin:0 auto 1.8em;
  }
  .tribute-line1{
    font-size:clamp(1.25rem,3.2vw,1.85rem);
    font-style:italic;
    line-height:1.55;
    color:#5a2323;
    margin:0;
  }
  .tribute-line2{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:clamp(1.7rem,5vw,2.6rem);
    color:var(--crimson);
    margin:0;
  }
  .tribute-line3{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-style:italic;
    font-size:clamp(1.5rem,4.4vw,2.2rem);
    background:linear-gradient(180deg, #c79a2c 0%, var(--gold) 55%, #9c7523 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0;
  }
  .tribute-line3 .heart{ -webkit-text-fill-color:initial; }
  #site .site-cta{
    display:inline-block;
    margin-top:.6em;
    padding:.75em 2.1em;
    border-radius:999px;
    background:linear-gradient(135deg,var(--crimson),var(--crimson-light));
    color:var(--gold-bright);
    text-decoration:none;
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:.95rem;
    letter-spacing:.04em;
    box-shadow:0 10px 30px -8px rgba(110,13,13,.55);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  #site .site-cta:hover, #site .site-cta:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 14px 34px -8px rgba(110,13,13,.65);
  }

  /* ============ Ceremony overlay ============ */
  #ceremony{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:9999;
    overflow:hidden;
    background:var(--deep-red);
  }
  #ceremony[hidden]{ display:none; }

  /* Curtains */
  .curtain{
    position:absolute;
    top:0;
    bottom:0;
    width:50%;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(0,0,0,.16) 0px,
        rgba(0,0,0,.16) 6px,
        rgba(255,255,255,.045) 6px,
        rgba(255,255,255,.045) 13px,
        transparent 13px,
        transparent 34px
      ),
      radial-gradient(ellipse at top, var(--crimson-light) 0%, var(--crimson) 45%, var(--deep-red) 100%);
    transition:transform 1.65s var(--ease-ceremony);
    box-shadow: inset 0 0 140px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.4);
  }
  .curtain::before{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:120px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.5), transparent 70%);
  }
  .curtain-left{ left:0; transform:translateX(0); border-right:3px solid var(--gold); }
  .curtain-right{ right:0; transform:translateX(0); border-left:3px solid var(--gold); }
  .curtain-left::before{ right:-40px; }
  .curtain-right::before{ left:-40px; }

  #ceremony.opening .curtain-left{ transform:translateX(-102%); }
  #ceremony.opening .curtain-right{ transform:translateX(102%); }

  .ceremony-vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 50% 40%, rgba(255,230,170,.16), transparent 60%),
      radial-gradient(ellipse 120% 90% at 50% 50%, transparent 50%, rgba(0,0,0,.45) 100%);
    z-index:2;
  }

  /* Ceremony content: deliberately wordless — visuals + interaction only */
  .ceremony-content{
    position:relative;
    z-index:3;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 6vw;
    transition:opacity .6s ease, transform .6s ease;
  }
  #ceremony.opening .ceremony-content{
    opacity:0;
    transform:scale(1.04);
    pointer-events:none;
  }

  .loading-ring{
    width:46px; height:46px;
    border-radius:50%;
    border:3px solid rgba(212,175,55,.25);
    border-top-color:var(--gold);
    animation:spin 1s linear infinite;
    transition:opacity .4s ease;
  }
  .loading-ring[hidden]{ display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .ceremony-stage{
    display:flex;
    align-items:center;
    justify-content:center;
    animation:stageFadeIn .8s var(--ease-ceremony) forwards;
    opacity:0;
  }
  .ceremony-stage[hidden]{ display:none; }
  @keyframes stageFadeIn{ to{ opacity:1; } }

  /* ---- Ribbon + real floating scissors (single synced SVG) ---- */
  .ribbon-rig{
    width:min(520px,88vw);
    height:auto;
    filter:drop-shadow(0 14px 26px rgba(0,0,0,.5));
    overflow:visible;
  }
  .glow-pulse{
    animation:pulseGlow 2.4s ease-in-out infinite;
    transform-origin:230px 58px;
  }
  @keyframes pulseGlow{
    0%,100%{ opacity:.35; transform:scale(1); }
    50%{ opacity:.75; transform:scale(1.18); }
  }

  .ribbon-left, .ribbon-right, .ribbon-knot{
    transition:transform .6s ease, opacity .5s ease .08s;
  }
  .ribbon-left{ transform-origin:226px 60px; }
  .ribbon-right{ transform-origin:234px 60px; }
  .ribbon-knot{ transform-origin:230px 61px; }
  #ceremony.cutting .ribbon-left{ transform:translate(-32px,30px) rotate(-16deg); opacity:0; }
  #ceremony.cutting .ribbon-right{ transform:translate(32px,30px) rotate(16deg); opacity:0; }
  #ceremony.cutting .ribbon-knot{ transform:scale(.3); opacity:0; }

  .scissor-hit{
    cursor:pointer;
    display:block;
    background:none;
    border:none;
    padding:0;
    margin:0;
    -webkit-tap-highlight-color:transparent;
  }
  .scissor-hit:focus-visible ~ .glow-pulse,
  .scissor-hit:focus-visible{
    outline:none;
  }
  .scissor-hit:focus-visible + .scissor-rig .glow-pulse{
    opacity:1;
  }

  .scissor-float{
    animation:floatHover 2.6s ease-in-out infinite;
    transform-origin:0 0;
  }
  .scissor-rig.settled .scissor-float{
    animation:none;
  }
  @keyframes floatHover{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-9px) rotate(2deg); }
  }

  .scissor-descend{
    transform:translateY(0);
    transform-origin:0 0;
    transition:transform .85s var(--cut-ease);
  }
  .scissor-rig.active .scissor-descend{
    transform:translateY(103px);
  }

  .blade{
    transform-origin:0 0;
    transition:transform .85s var(--cut-ease);
  }
  .blade-left{ transform:rotate(-20deg); }
  .blade-right{ transform:rotate(20deg); }
  #ceremony .scissor-rig.active .blade-left{ transform:rotate(-3deg); }
  #ceremony .scissor-rig.active .blade-right{ transform:rotate(3deg); }

  /* Confetti */
  #confetti-container{
    position:absolute;
    inset:0;
    z-index:5;
    pointer-events:none;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:-5%;
    border-radius:2px;
    opacity:0;
    animation-name:confettiFall;
    animation-timing-function:ease-in;
    animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    0%{ opacity:0; transform:translateY(0) rotate(0deg); }
    8%{ opacity:1; }
    100%{ opacity:0; transform:translateY(105vh) rotate(600deg); }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    .curtain, .ceremony-content, .ribbon-left, .ribbon-right, .ribbon-knot,
    .scissor-descend, .blade, .ceremony-stage, .scissor-float{
      transition-duration:.01ms !important;
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
    }
  }
</style>
</head>
<body>

  <!-- ============ The AbiLearn site, revealed once the ribbon is cut ============ -->
  <main id="site" aria-hidden="true">
    <p class="site-mark">Abi<span>Learn</span></p>
    <div class="tribute-final">
      <p class="tribute-line1">It is my greatest tribute to you mam in my last year of school.</p>
      <p class="tribute-line2">Happy Teacher's Day Mam</p>
      <p class="tribute-line3">Abi Mam Forever <span class="heart">❤️</span></p>
    </div>
    <a class="site-cta" id="siteEnterLink" href="#" rel="noopener">Enter AbiLearn →</a>
  </main>

  <!-- ============ Grand opening ceremony overlay (intentionally wordless) ============ -->
  <div id="ceremony" role="dialog" aria-modal="true" aria-label="AbiLearn Teacher's Day grand opening ceremony">
    <div class="curtain curtain-left" aria-hidden="true"></div>
    <div class="curtain curtain-right" aria-hidden="true"></div>
    <div class="ceremony-vignette" aria-hidden="true"></div>

    <div class="ceremony-content">
      <div class="loading-ring" id="loadingRing" role="status" aria-label="Preparing the ceremony"></div>

      <div class="ceremony-stage" id="ceremonyStage" hidden>
        <button type="button" class="scissor-hit" id="openBtn"
                aria-label="Cut the ribbon to open AbiLearn">
          <svg class="ribbon-rig" viewBox="0 0 460 210" preserveAspectRatio="xMidYMid meet" focusable="false">
            <defs>
              <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffedb0"/>
                <stop offset="45%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#8a651c"/>
              </linearGradient>
              <radialGradient id="knotGrad" cx="35%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#fff6da"/>
                <stop offset="60%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#7a5a17"/>
              </radialGradient>
              <linearGradient id="bladeGrad" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#8f98a3"/>
                <stop offset="55%" stop-color="#d8dee5"/>
                <stop offset="100%" stop-color="#f6f8fa"/>
              </linearGradient>
              <radialGradient id="pivotGrad" cx="35%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#fff6da"/>
                <stop offset="100%" stop-color="#b6862a"/>
              </radialGradient>
              <linearGradient id="handleGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffedb0"/>
                <stop offset="100%" stop-color="#b6862a"/>
              </linearGradient>
              <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffedb0" stop-opacity=".9"/>
                <stop offset="100%" stop-color="#ffedb0" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- Ceremonial ribbon, gently sagging like a real strung ribbon -->
            <path class="ribbon-left" d="M0,50 C110,18 168,18 226,50 L226,74 C168,42 110,42 0,74 Z" fill="url(#ribbonGrad)"/>
            <path class="ribbon-right" d="M460,50 C350,18 292,18 234,50 L234,74 C292,42 350,42 460,74 Z" fill="url(#ribbonGrad)"/>
            <circle class="ribbon-knot" cx="230" cy="62" r="17" fill="url(#knotGrad)" stroke="#7a5a17" stroke-width="1"/>

            <!-- Glow affordance showing the scissors are interactive -->
            <circle class="glow-pulse" cx="230" cy="58" r="46" fill="url(#glowGrad)"/>

            <!-- Real floating ceremonial scissors, hovering above the ribbon -->
            <g class="scissor-rig" id="scissorRig" transform="translate(230,58)">
              <g class="scissor-float">
                <g class="scissor-descend" id="scissorDescend">
                  <path class="handle" fill="url(#handleGrad)" fill-rule="evenodd"
                        d="M -32,10 a20,26 0 1,0 40,0 a20,26 0 1,0 -40,0 M -24,10 a12,16 0 1,0 24,0 a12,16 0 1,0 -24,0"/>
                  <path class="handle" fill="url(#handleGrad)" fill-rule="evenodd"
                        d="M 12,10 a20,26 0 1,0 40,0 a20,26 0 1,0 -40,0 M 20,10 a12,16 0 1,0 24,0 a12,16 0 1,0 -24,0"/>
                  <g class="blade blade-left">
                    <path fill="url(#bladeGrad)" stroke="#6b7480" stroke-width=".6"
                          d="M0,0 L-9,-6 C-13,-26 -10,-54 -3,-76 L3,-76 C7,-52 8,-26 6,-6 Z"/>
                  </g>
                  <g class="blade blade-right">
                    <path fill="url(#bladeGrad)" stroke="#6b7480" stroke-width=".6"
                          d="M0,0 L-6,-6 C-8,-26 -7,-52 -3,-76 L3,-76 C9,-54 12,-26 9,-6 Z"/>
                  </g>
                  <circle class="pivot" cx="0" cy="0" r="6.5" fill="url(#pivotGrad)" stroke="#7a5a17" stroke-width="1"/>
                </g>
              </g>
            </g>
          </svg>
        </button>
      </div>
    </div>

    <div id="confetti-container" aria-hidden="true"></div>
  </div>

  <p class="visually-hidden" id="ceremonyAnnouncer" role="status" aria-live="polite"></p>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Replace this with your real AbiLearn website URL. Leave it as "" to
  // simply reveal the built-in AbiLearn tribute page instead of
  // redirecting away.
  // ---------------------------------------------------------------------
  const ABILEARN_URL = "";

  const htmlEl = document.documentElement;
  const ceremony = document.getElementById('ceremony');
  const loadingRing = document.getElementById('loadingRing');
  const ceremonyStage = document.getElementById('ceremonyStage');
  const openBtn = document.getElementById('openBtn');
  const scissorRig = document.getElementById('scissorRig');
  const scissorDescend = document.getElementById('scissorDescend');
  const announcer = document.getElementById('ceremonyAnnouncer');
  const confettiContainer = document.getElementById('confetti-container');
  const site = document.getElementById('site');
  const siteEnterLink = document.getElementById('siteEnterLink');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (siteEnterLink) {
    siteEnterLink.href = ABILEARN_URL || '#';
    if (!ABILEARN_URL) siteEnterLink.addEventListener('click', e => e.preventDefault());
  }

  // Lock page scroll while the ceremony is active.
  htmlEl.classList.add('ceremony-lock');

  let opened = false;

  // ---- Intentional "loading" beat before the ribbon & scissors appear ----
  window.setTimeout(() => {
    loadingRing.hidden = true;
    ceremonyStage.hidden = false;
    openBtn.focus();
  }, reduceMotion ? 50 : 1200);

  // ---- Golden confetti burst ----
  function launchConfetti() {
    const colors = ['#d4af37', '#f3d576', '#ffedb0', '#ffffff'];
    const count = reduceMotion ? 0 : 90;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      const size = 6 + Math.random() * 8;
      piece.style.width = size + 'px';
      piece.style.height = size * (0.4 + Math.random() * 0.6) + 'px';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      piece.style.animationDelay = (Math.random() * 0.5) + 's';
      confettiContainer.appendChild(piece);
      piece.addEventListener('animationend', () => piece.remove());
    }
  }

  // ---- The scissors physically descend; the ribbon cuts the instant they arrive ----
  function openCeremony() {
    if (opened) return;
    opened = true;

    openBtn.disabled = true;
    announcer.textContent = 'The scissors are descending toward the ribbon…';

    // Stop the idle hover so the descent is a single clean motion.
    scissorRig.classList.add('settled');
    // Force reflow so removing the float animation takes effect before we start the descent.
    void scissorRig.offsetWidth;
    scissorRig.classList.add('active');

    let cutFired = false;
    const triggerCut = () => {
      if (cutFired) return;
      cutFired = true;
      ceremony.classList.add('cutting');
      announcer.textContent = 'The ribbon is cut — AbiLearn is opening…';

      window.setTimeout(() => {
        ceremony.classList.add('opening');
        launchConfetti();
      }, reduceMotion ? 0 : 480);

      window.setTimeout(finishCeremony, reduceMotion ? 50 : 480 + 1650);
    };

    // The cut fires automatically the instant the scissors' blades reach the ribbon.
    scissorDescend.addEventListener('transitionend', function handler(e) {
      if (e.propertyName !== 'transform') return;
      scissorDescend.removeEventListener('transitionend', handler);
      triggerCut();
    });
    // Safety net in case the transitionend event doesn't fire in some browser context.
    window.setTimeout(triggerCut, reduceMotion ? 60 : 950);
  }

  function finishCeremony() {
    ceremony.setAttribute('hidden', '');
    ceremony.setAttribute('aria-hidden', 'true');
    htmlEl.classList.remove('ceremony-lock');

    site.removeAttribute('aria-hidden');
    site.setAttribute('tabindex', '-1');
    site.focus();

    announcer.textContent = "AbiLearn is now open. Happy Teacher's Day, Abi Mam!";

    if (ABILEARN_URL) {
      window.setTimeout(() => {
        window.location.href = ABILEARN_URL;
      }, 700);
    }
  }

  openBtn.addEventListener('click', openCeremony);

  // Extra keyboard support: Enter/Space activate the button natively;
  // Enter anywhere on the page also triggers the ceremony while it's active.
  document.addEventListener('keydown', (e) => {
    if (opened) return;
    if (e.key === 'Enter' && !ceremony.hasAttribute('hidden') && document.activeElement !== openBtn) {
      openCeremony();
    }
  });
})();
</script>
</body>
</html>
